version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: pujofy_postgres
    restart: always
    environment:
      POSTGRES_USER: pujofy_user
      POSTGRES_PASSWORD: pujofy_password
      POSTGRES_DB: pujofy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pgdata:
